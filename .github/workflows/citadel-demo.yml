name: citadel-demo
# A varied workload that produces a mix of events Citadel can categorize:
#   - allowed-by-policy: github.com, api.github.com, registry.npmjs.org
#   - new-domain (triggers a detection): httpbin.org, ipinfo.io
#   - file writes: touches files in the workspace
#   - process execs: bash, curl, node, dd, etc.
#
# Used to demo the dashboard's Network / Files / Processes / Recommendations
# tabs end-to-end. Triggered manually via the Actions UI.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/citadel-demo.yml'

jobs:
  demo:
    runs-on: [self-hosted, linux, citadel-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Citadel
        uses: ./action
        with:
          mode: audit
          backend-url: http://localhost:8080
          image-tag: dev
          watch-path: ${{ github.workspace }}

      # ──────────────────────────────────────────────────────────────
      # 1. ALLOWED traffic — well-known build-tool destinations. With a
      #    policy that allowlists these, they'll show as green in the UI.
      # ──────────────────────────────────────────────────────────────
      - name: Allowed network calls (github + npm)
        run: |
          citadel-step "allowed: github api"
          curl -sS https://api.github.com/zen
          echo
          citadel-step "allowed: npm registry search"
          curl -sS "https://registry.npmjs.org/-/v1/search?text=react&size=1" | head -c 200
          echo
          citadel-step "allowed: github raw"
          curl -sS https://raw.githubusercontent.com/octocat/Hello-World/master/README | head -c 100
          echo

      # ──────────────────────────────────────────────────────────────
      # 2. NEW-DOMAIN traffic — hosts that aren't on the allowlist. In
      #    audit mode these surface as "new_domain" detections (medium).
      #    In block mode the cgroup_skb egress filter drops the packets.
      # ──────────────────────────────────────────────────────────────
      - name: Suspicious-looking network calls
        run: |
          citadel-step "suspicious: httpbin"
          curl -sS https://httpbin.org/get | head -c 200
          echo
          citadel-step "suspicious: ipinfo"
          curl -sS https://ipinfo.io/json | head -c 200
          echo

      # ──────────────────────────────────────────────────────────────
      # 3. FILE WRITES inside the workspace — picked up by the file probe.
      # ──────────────────────────────────────────────────────────────
      - name: File-write activity
        run: |
          citadel-step "file: workspace writes"
          echo "hello from a CI run" > ${GITHUB_WORKSPACE}/citadel-demo-note.txt
          mkdir -p ${GITHUB_WORKSPACE}/.citadel-demo
          dd if=/dev/urandom of=${GITHUB_WORKSPACE}/.citadel-demo/blob.bin bs=1024 count=8 2>/dev/null
          ls -la ${GITHUB_WORKSPACE}/.citadel-demo

      # ──────────────────────────────────────────────────────────────
      # 4. PROCESS EXEC activity — distinct binaries the proc probe sees.
      # ──────────────────────────────────────────────────────────────
      - name: Process variety
        run: |
          citadel-step "proc: variety"
          uname -a
          whoami
          date
          python3 -c "print('hi from python')"
          bash -c "echo nested shell"

      # ──────────────────────────────────────────────────────────────
      # 5. Optional: leave one obviously-malicious-looking pattern to
      #    light up the reverse_shell / suspicious_exec rules.
      #    The connection is to localhost on a port nothing listens on, so
      #    it fails fast — but the SYN attempt is captured by the net probe
      #    and the shell-out-of-build-tool pattern matches the rule.
      # ──────────────────────────────────────────────────────────────
      - name: Reverse-shell pattern (harmless — port is closed)
        run: |
          citadel-step "attack: reverse-shell pattern"
          timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/14444; echo hello >&3' || true
