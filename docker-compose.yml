# Citadel — local dev compose.
#
# NOTE: the agent does NOT run here. It needs host-level eBPF access
# (--privileged --pid=host --network=host plus /sys/fs/cgroup mount), so
# it runs directly on the self-hosted runner VM via `docker run` or via
# the citadel-setup GitHub Action. See /action/action.yml.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: citadel-backend:dev
    container_name: citadel-backend
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data
    environment:
      DB_PATH: /data/citadel.db
    restart: unless-stopped

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    image: citadel-detector:dev
    container_name: citadel-detector
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      POLL_INTERVAL_SECONDS: "2"
    volumes:
      - detector-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: citadel-dashboard:dev
    container_name: citadel-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    restart: unless-stopped

volumes:
  backend-data:
  detector-data:
