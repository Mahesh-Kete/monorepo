name: victim-ci

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, guardrail-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
