name: 'Citadel Setup'
description: 'Runtime EDR for CI/CD: load eBPF probes inside the runner, ship events to Citadel backend, snapshot workspace, run agent for the lifetime of the job.'
author: 'Mahesh-Kete'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  # mode is no longer configurable — Citadel runs in block mode only.
  # Kept as an input for backwards-compat with workflows that still pass it.
  mode:
    description: '(deprecated — always "block")'
    required: false
    default: 'block'
  backend-url:
    description: 'Citadel backend URL (e.g. http://backend.internal:8080)'
    required: true
  image-tag:
    description: 'Citadel agent image tag. Use "dev" for locally-built images (skips docker pull).'
    required: false
    default: 'latest'
  image-repo:
    description: 'Docker repository prefix. Default is the workflow repo''s GHCR namespace.'
    required: false
    default: ''
  watch-path:
    description: 'Workspace root to monitor for file-tamper detection.'
    required: false
    default: ''
  container-name:
    description: 'Docker container name for the agent.'
    required: false
    default: 'citadel'

runs:
  using: 'composite'
  steps:
    # ----------------------------------------------------------------
    # 1. Write GitHub Actions context to a file the agent can read.
    # ----------------------------------------------------------------
    - name: 'Citadel: write workflow metadata'
      shell: bash
      run: |
        cat > /tmp/citadel-meta.json <<EOF
        {
          "repository":   "${GITHUB_REPOSITORY}",
          "workflow":     "${GITHUB_WORKFLOW}",
          "workflow_file":"${GITHUB_WORKFLOW_REF}",
          "run_id":       "${GITHUB_RUN_ID}",
          "run_number":   "${GITHUB_RUN_NUMBER}",
          "sha":          "${GITHUB_SHA}",
          "ref":          "${GITHUB_REF}",
          "actor":        "${GITHUB_ACTOR}",
          "event_name":   "${GITHUB_EVENT_NAME}",
          "job":          "${GITHUB_JOB}"
        }
        EOF
        : > /tmp/citadel-current-step

    # ----------------------------------------------------------------
    # 2. Install the citadel-step helper so user steps can tag themselves.
    #    Usage in a workflow step: `run: citadel-step "npm install"`
    # ----------------------------------------------------------------
    - name: 'Citadel: install citadel-step helper'
      shell: bash
      run: |
        sudo tee /usr/local/bin/citadel-step >/dev/null <<'EOF'
        #!/usr/bin/env bash
        # Mark the current workflow step name so the agent can tag events.
        echo "$*" > /tmp/citadel-current-step
        EOF
        sudo chmod +x /usr/local/bin/citadel-step

    # ----------------------------------------------------------------
    # 3. Resolve the agent image ref (dev → local, otherwise GHCR).
    # ----------------------------------------------------------------
    - name: 'Citadel: resolve image ref'
      id: img
      shell: bash
      run: |
        if [ "${{ inputs.image-tag }}" = "dev" ]; then
          echo "ref=citadel-agent:dev" >> "$GITHUB_OUTPUT"
        else
          REPO="${{ inputs.image-repo }}"
          if [ -z "$REPO" ]; then
            REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          fi
          echo "ref=${REPO}/citadel-agent:${{ inputs.image-tag }}" >> "$GITHUB_OUTPUT"
        fi

    # ----------------------------------------------------------------
    # 4. Workspace baseline snapshot (immediately after checkout).
    #    This runs the agent's `snapshot` subcommand inside the same image.
    # ----------------------------------------------------------------
    - name: 'Citadel: snapshot workspace'
      shell: bash
      run: |
        WATCH_PATH="${{ inputs.watch-path }}"
        if [ -z "$WATCH_PATH" ]; then
          WATCH_PATH="$GITHUB_WORKSPACE"
        fi
        echo "==> Snapshotting $WATCH_PATH"
        docker run --rm \
          -v "$WATCH_PATH":/workspace:ro \
          -v /tmp:/host-tmp \
          "${{ steps.img.outputs.ref }}" \
          snapshot --path /workspace --out /host-tmp/citadel-baseline.json
        echo "==> Baseline written to /tmp/citadel-baseline.json"

    # ----------------------------------------------------------------
    # 5. Start the agent in the background.
    #    --privileged --pid=host --network=host because eBPF needs them.
    # ----------------------------------------------------------------
    - name: 'Citadel: start agent'
      shell: bash
      run: |
        WATCH_PATH="${{ inputs.watch-path }}"
        if [ -z "$WATCH_PATH" ]; then
          WATCH_PATH="$GITHUB_WORKSPACE"
        fi
        # debugfs + tracefs are required for tracepoint attach. They live on
        # the host kernel; we bind-mount them into the container because
        # --privileged alone doesn't make them visible.
        docker run -d \
          --name "${{ inputs.container-name }}" \
          --privileged --pid=host --network=host \
          -v /sys/fs/cgroup:/sys/fs/cgroup \
          -v /sys/kernel/debug:/sys/kernel/debug \
          -v /sys/kernel/tracing:/sys/kernel/tracing \
          -v /tmp:/tmp \
          -v "$WATCH_PATH":"$WATCH_PATH" \
          "${{ steps.img.outputs.ref }}" \
          run \
            --mode=block \
            --backend-url="${{ inputs.backend-url }}" \
            --meta-file=/tmp/citadel-meta.json \
            --watch-path="$WATCH_PATH" \
            --log-file=/tmp/citadel-agent.log
        # Give the agent time to attach probes.
        sleep 3
        echo "==> Citadel agent running in container ${{ inputs.container-name }}"
        docker ps --filter "name=${{ inputs.container-name }}" --format "{{.Names}} {{.Status}}"

    # ----------------------------------------------------------------
    # 5b. Imposter-commit scan.
    #     Walk every .github/workflows/*.yml file in the checked-out
    #     workspace, extract pinned 40-char SHA references
    #     (`uses: org/repo[/path]@<sha>`), and verify each SHA is
    #     reachable from the default branch of org/repo. If not, we
    #     POST a detection of severity=critical and rule_name=
    #     'imposter_commit' to the Citadel backend.
    # ----------------------------------------------------------------
    - name: 'Citadel: imposter-commit scan'
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BACKEND="${{ inputs.backend-url }}"
        REPO="${GITHUB_REPOSITORY}"
        RUN="${GITHUB_RUN_ID}"

        echo "==> Citadel imposter-commit scan over .github/workflows/"
        if [ ! -d .github/workflows ]; then
          echo "no workflows dir; skipping"
          exit 0
        fi

        # Collect pinned SHA references: "uses: org/repo[/path]@<40hex>".
        # awk strips inline comments + whitespace; sort -u dedups.
        refs=$(grep -ahoE 'uses:[[:space:]]*[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@[0-9a-f]{40}' \
                 .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null \
               | awk '{print $2}' | sort -u)

        if [ -z "$refs" ]; then
          echo "no pinned-SHA action references found"
          exit 0
        fi

        post_detection() {
          local msg="$1"
          curl -fsS -X POST "$BACKEND/api/detections/by-github-run" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg r "$REPO" --arg g "$RUN" --arg m "$msg" '{
              repository: $r, github_run_id: $g,
              rule_name: "imposter_commit", severity: "critical",
              message: $m
            }')" >/dev/null \
            && echo "✗ detection posted: $msg" \
            || echo "(failed to post detection to backend — continuing)"
        }

        while IFS= read -r ref; do
          [ -z "$ref" ] && continue
          owner_repo="${ref%@*}"
          sha="${ref##*@}"
          base_repo=$(echo "$owner_repo" | awk -F/ '{print $1"/"$2}')

          echo "checking $owner_repo @ $sha (base=$base_repo)"
          # Compare default branch HEAD ... sha.
          # status: identical | behind = sha is an ancestor of HEAD = SAFE
          # status: ahead | diverged    = sha is NOT on default branch = IMPOSTER
          # 404 / error                 = sha doesn't exist on this repo at all
          status=$(gh api -X GET "repos/$base_repo/compare/HEAD...$sha" \
                    --jq '.status // empty' 2>/dev/null || true)

          case "$status" in
            identical|behind)
              echo "  ✓ $sha reachable from default branch — safe"
              ;;
            ahead|diverged)
              post_detection "Imposter commit reference: $owner_repo@$sha is NOT reachable from $base_repo's default branch (status: $status). Likely a fork-controlled SHA that looks pinned for security but isn't on the upstream main line."
              ;;
            "")
              post_detection "Unverifiable action SHA: $owner_repo@$sha could not be located on $base_repo (404 or API error). Either an imposter-commit reference or a stale pin."
              ;;
            *)
              post_detection "Unexpected compare status '$status' for $owner_repo@$sha — flagging for review."
              ;;
          esac
        done <<< "$refs"

    # ----------------------------------------------------------------
    # 6. Post-job: diff the workspace against the baseline (always),
    #    then tear the agent down.
    # ----------------------------------------------------------------
    - name: 'Citadel: workspace diff + teardown'
      if: always()
      shell: bash
      run: |
        WATCH_PATH="${{ inputs.watch-path }}"
        if [ -z "$WATCH_PATH" ]; then
          WATCH_PATH="$GITHUB_WORKSPACE"
        fi
        echo "==> Diffing workspace against baseline"
        docker run --rm \
          -v "$WATCH_PATH":/workspace:ro \
          -v /tmp:/host-tmp \
          "${{ steps.img.outputs.ref }}" \
          diff \
            --before /host-tmp/citadel-baseline.json \
            --after-path /workspace \
            --backend-url="${{ inputs.backend-url }}" \
            --meta-file=/host-tmp/citadel-meta.json || true

        echo "==> Stopping citadel agent"
        docker logs "${{ inputs.container-name }}" 2>&1 | tail -50 || true
        docker stop "${{ inputs.container-name }}" >/dev/null 2>&1 || true
        docker rm   "${{ inputs.container-name }}" >/dev/null 2>&1 || true
