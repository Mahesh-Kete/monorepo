name: attack-3-tamper
# Demo goal: DETECT TAMPERING.
#
# A malicious composite action appends a "backdoor" comment to a source file
# AFTER actions/checkout but BEFORE the build step. Citadel catches this in
# two places:
#   1. LIVE — the file probe sees the openat() with write flags from `bash`,
#      and the detector's source_modified_after_checkout rule fires.
#   2. POST-JOB — the agent's `diff` subcommand at job end compares the
#      workspace's current SHA256 set against the baseline taken right after
#      checkout, and emits a `file_tamper` event for examples/index.js.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, citadel-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Citadel
        uses: ./action
        with:
          mode: audit
          backend-url: http://localhost:8080
          image-tag: dev
          watch-path: ${{ github.workspace }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          citadel-step "npm install"
          cd examples && npm install

      - name: Inject Telemetry
        uses: ./examples/attacks/tamper

      - name: Build
        run: |
          citadel-step "npm run build"
          cd examples && npm run build
